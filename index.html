{id:9,type:'bath',name:'욕실',x:790,y:210,w:50,h:55,rotate:0}]} };;const clone=()=>JSON.parse(JSON.stringify(data));let snap=()=>{history.push(clone());if(history.length>45)history.shift()};let toastTimer;function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}function node(t,attrs,parent=svg){let e=document.createElementNS(NS,t);for(let [k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);parent.append(e);return e}function val(v){return Math.round(Number(v)||0)}function getSel(){return [...data.rooms,...data.items,...data.fixtures].find(o=>o.id===selected)}function getRoom(id){return data.rooms.find(o=>o.id===id)}function clear(){svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${paper.w} ${paper.h}`);node('rect',{width:paper.w,height:paper.h,fill:'#fff'});}function txt(x,y,text,size=14,color='#6d7a7b',extra={}){let t=node('text',{x,y,'text-anchor':'middle','font-family':'Arial, sans-serif','font-size':size,fill:color,...extra});t.textContent=text;return t}

function field(label,key,v,type='number'){return `<div class="field"><label>${label}</label><input data-key="${key}" type="${type}" value="${String(v).replace(/"/g,'&quot;')}" ${type==='number'?'step="1"':''}></div>`}function selectField(label,key,val,opts){return `<div class="field"><label>${label}</label><select data-key="${key}">${opts.map(([v,t])=>`<option value="${v}" ${String(v)===String(val)?'selected':''}>${t}</option>`).join('')}</select></div>`}function renderProps(){let o=getSel();if(!o){props.innerHTML=`<div class="selecthint">도면에서 방을 선택하거나<br>왼쪽에서 새 방을 추가해 주세요.</div><div class="divider"></div><div class="mini">현재 방 ${data.rooms.length}개 · 문/창문 ${data.items.length}개 · 설비 ${data.fixtures.length}개</div>`;return}let h=`<div class="prop-title">${o.type==='room'?'방 설정':({door:'문',window:'창문',stairs:'계단',bath:'욕실 설비',kitchen:'주방 설비',text:'텍스트'}[o.type]||'요소')+' 편집'}</div><div class="tiny">수정 후 Enter 또는 다른 곳 클릭</div>`;if(o.type==='room'){h+=field('공간 이름','name',o.name,'text')+`<div class="fieldrow">${field('가로 (cm)','w',o.w)}${field('세로 (cm)','h',o.h)}</div>`+`<div class="fieldrow">${field('왼쪽 위치','x',o.x)}${field('위쪽 위치','y',o.y)}</div>`+`<div class="mini">면적: ${(o.w*o.h/10000).toFixed(2)} ㎡</div>`+selectField('바닥 배경색','fill',o.fill,[['#f8f9f7','화이트 그레이'],['#ffffff','순백색'],['#f0f5f2','소프트 세이지'],['#f8f4ed','웜 아이보리']]);h+=`<div class="actionrow"><button class="btn" id="adddoor">+ 문</button><button class="btn" id="addwindow">+ 창문</button></div>`}else if(o.type==='door'||o.type==='window'){h+=selectField('배치할 벽','side',o.side,[['top','위쪽'],['right','오른쪽'],['bottom','아래쪽'],['left','왼쪽']])+field('폭 (cm)','size',o.size)+`<div class="field"><label>벽에서의 위치</label><input type="range" min="5" max="95" data-key="pos" value="${Math.round(o.pos*100)}"><span class="tiny">${Math.round(o.pos*100)}%</span></div>`;if(o.type==='door')h+=selectField('열림 방향','flip',o.flip,[['false','기본 방향'],['true','반대 방향']]);}else{h+=field('이름','name',o.name,'text')+`<div class="fieldrow">${field('가로 (cm)','w',o.w)}${field('세로 (cm)','h',o.h)}</div>`+`<div class="fieldrow">${field('X 위치','x',o.x)}${field('Y 위치','y',o.y)}</div>`+selectField('회전','rotate',o.rotate||0,[[0,'0°'],[90,'90°'],[180,'180°'],[270,'270°']])}h+=`<div class="actionrow"><button class="btn" id="duplicate">복제</button><button class="btn" id="delete">삭제</button></div>`;props.innerHTML=h;props.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('change',()=>{let a=getSel();if(!a)return;snap();let k=el.dataset.key,v=el.value;if(k==='pos')a[k]=Number(v)/100;else if(k==='flip')a[k]=v==='true';else if(['name','side','fill'].includes(k))a[k]=v;else a[k]=val(v);if(['w','h','size'].includes(k))a[k]=Math.max(20,a[k]);render()})});let del=document.getElementById('delete'),dup=document.getElementById('duplicate');del.onclick=()=>{snap();data.rooms=data.rooms.filter(r=>r.id!==selected);data.items=data.items.filter(r=>r.id!==selected&&getRoom(r.room));data.fixtures=data.fixtures.filter(r=>r.id!==selected);selected=null;render()};dup.onclick=()=>{snap();let a=JSON.parse(JSON.stringify(getSel()));a.id=++uid;if(a.type==='room'){a.x+=28;a.y+=28;data.rooms.push(a)}else if(['door','window'].includes(a.type)){a.pos=Math.min(.9,a.pos+.16);data.items.push(a)}else{a.x+=28;a.y+=28;data.fixtures.push(a)}selected=a.id;render()};let bd=document.getElementById('adddoor'),bw=document.getElementById('addwindow');if(bd)bd.onclick=()=>addItem('door');if(bw)bw.onclick=()=>addItem('window')}
function addItem(type){let r=getSel();if(!r||r.type!=='room'){toast('먼저 방을 선택해 주세요');return}snap();let it={id:++uid,type,room:r.id,side:'bottom',pos:.5,size:type==='door'?80:120,flip:false};data.items.push(it);selected=it.id;setTool('select');render()}
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('active',el.dataset.tool===t))}document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{let t=b.dataset.tool;if(t==='room'){snap();let n=data.rooms.length;let o={id:++uid,type:'room',name:`${n+1}번방`,x:130+(n%3)*35,y:120+(n%3)*40,w:320,h:300,fill:'#f8f9f7'};data.rooms.push(o);selected=o.id;render();setTool('select')}else if(['door','window'].includes(t)){if(getSel()?.type==='room')addItem(t);else toast('도면에서 방을 먼저 클릭해 주세요')}else if(['bath','kitchen','stairs','text'].includes(t)){snap();let names={bath:'욕실',kitchen:'주방',stairs:'계단',text:'텍스트'},sizes={bath:[75,65],kitchen:[145,55],stairs:[100,140],text:[90,35]};let f={id:++uid,type:t,name:names[t],x:400,y:300,w:sizes[t][0],h:sizes[t][1],rotate:0};data.fixtures.push(f);selected=f.id;render();setTool('select')}else setTool(t)});
function svgPoint(ev){let pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}svg.addEventListener('pointerdown',ev=>{let el=ev.target.closest('[data-id]');if(!el){selected=null;render();return}let id=Number(el.dataset.id);selected=id;let o=getSel();if(!o)return;render();if(o.type==='room'||data.fixtures.includes(o)){snap();let p=svgPoint(ev);drag={id,startX:p.x,startY:p.y,x:o.x,y:o.y,pointerId:ev.pointerId};svg.setPointerCapture(ev.pointerId)}});svg.addEventListener('pointermove',ev=>{if(!drag)return;let o=getSel();if(!o||o.id!==drag.id)return;let p=svgPoint(ev);o.x=Math.round((drag.x+(p.x-drag.startX))/5)*5;o.y=Math.round((drag.y+(p.y-drag.startY))/5)*5;render()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
document.getElementById('undo').onclick=()=>{if(!history.length)return;data=history.pop();selected=null;render()};document.getElementById('save').onclick=()=>{download(new Blob([JSON.stringify({version:2,data,paper},null,2)],{type:'application/json'}),'다옴하우스_평면도_프로젝트.json')};document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=JSON.parse(await f.text());if(!parsed.data?.rooms||!parsed.data?.items||!parsed.data?.fixtures)throw Error('format');snap();data=parsed.data;if(parsed.paper){paper=parsed.paper;syncPaper()}uid=Math.max(0,...[...data.rooms,...data.items,...data.fixtures].map(x=>x.id));selected=null;render();toast('프로젝트를 불러왔습니다')}catch{toast('지원하지 않는 프로젝트 파일입니다')}e.target.value=''};function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}document.getElementById('png').onclick=()=>{let saved=selected;selected=null;render();let xml=new XMLSerializer().serializeToString(svg);let blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=paper.w*2;c.height=paper.h*2;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'다옴하우스_평면도.png')},'image/png');URL.revokeObjectURL(url);selected=saved;render()};im.onerror=()=>{toast('이미지를 만들지 못했습니다');selected=saved;render()};im.src=url};
let autoSavePending;
function scheduleAutoSave(){clearTimeout(autoSavePending);autoSavePending=setTimeout(()=>{try{localStorage.setItem('daom-plan-autosave-v2',JSON.stringify({data,paper}))}catch(e){}},400)}
function syncPaper(){let select=document.getElementById('paperSize'),key=`${paper.w},${paper.h}`;select.value=[...select.options].some(x=>x.value===key)?key:'custom';document.getElementById('customSize').style.display=select.value==='custom'?'inline-flex':'none';document.getElementById('paperW').value=paper.w;document.getElementById('paperH').value=paper.h;setZoom(zoom)}
function setZoom(z){zoom=Math.max(.2,Math.min(2,Math.round(z*10)/10));let el=document.querySelector('.artboard');el.style.width=(paper.w*zoom)+'px';el.style.height=(paper.h*zoom)+'px';document.getElementById('zoomLabel').textContent=Math.round(zoom*100)+'%'}
function fitPaper(){let st=document.querySelector('.stagewrap');setZoom(Math.min(.9,(st.clientWidth-75)/paper.w,(st.clientHeight-155)/paper.h))}
function setPaper(w,h){paper={w:Math.max(400,Math.min(6000,w)),h:Math.max(400,Math.min(6000,h))};syncPaper();render();toast('도화지 크기를 변경했습니다')}
function loadPreset(k){if((data.rooms.length||data.fixtures.length)&&!confirm('샘플을 불러오면 현재 도면이 교체됩니다. 기존 작업을 프로젝트 파일로 저장하셨나요?'))return;snap();data=JSON.parse(JSON.stringify(presets[k]));selected=null;uid=Math.max(...[...data.rooms,...data.items,...data.fixtures].map(x=>x.id));paper={w:1400,h:1000};syncPaper();render();toast(k==='two'?'2층 구조 초안을 불러왔습니다':'3층 구조 초안을 불러왔습니다')}
function initExtras(){document.getElementById('paperSize').onchange=e=>{if(e.target.value==='custom'){document.getElementById('customSize').style.display='inline-flex';return}let [w,h]=e.target.value.split(',').map(Number);setPaper(w,h)};
document.getElementById('applySize').onclick=()=>setPaper(Number(document.getElementById('paperW').value),Number(document.getElementById('paperH').value));document.getElementById('zoomin').onclick=()=>setZoom(zoom+.1);document.getElementById('zoomout').onclick=()=>setZoom(zoom-.1);document.getElementById('fit').onclick=fitPaper;
document.getElementById('new2').onclick=()=>loadPreset('two');document.getElementById('new3').onclick=()=>loadPreset('three');
let stored;try{stored=JSON.parse(localStorage.getItem('daom-plan-autosave-v2')||'null')}catch{}if(stored&&stored.data?.rooms?.length){data=stored.data;paper=stored.paper||paper;uid=Math.max(0,...[...data.rooms,...data.items,...data.fixtures].map(o=>o.id));toast('이전 자동 저장 작업을 복구했습니다')}else{data=JSON.parse(JSON.stringify(presets.two));uid=15}syncPaper();setTimeout(fitPaper,0);
}
initExtras();render();})();
</script></body></html>
